[project]
site_name = "ethlo notes"
site_url = "https://blog.ethlo.com/"
site_description = "Notes from the bench: what I measured, what broke and what I would do differently."
site_author = "Morten Haraldsen"
copyright = "© Morten Haraldsen"
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
# Template overrides: the post list with pictures, and link-preview tags (see overrides/).
custom_dir = "overrides"
favicon = "assets/favicon.png"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# Dark first, like ethlo.com; the toggle gives a light page for those who read better on one.
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

# The blog is the whole site: posts are docs/posts/*.md, the list is docs/index.md.
[project.plugins.blog]
blog_dir = "."
post_url_format = "{slug}"
post_readtime = true

[project.plugins.rss]
match_path = "posts/.*"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ethlo"
